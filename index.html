<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,100;1,9..144,400..700,100&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdeef6; --ink:#3a2050; --berry:#c22d70; --rose:#ff6fa5; --lav:#b9a6ff; --mint:#7fdcc0; --butter:#ffd166;
    --b1:rgba(255,143,184,.62); --b2:rgba(185,166,255,.6); --b3:rgba(127,220,192,.5); --b4:rgba(255,209,102,.45);
    --g1:rgba(255,255,255,.64); --g2:rgba(255,255,255,.22); --gb:rgba(255,255,255,.78); --gh:rgba(255,255,255,.95); --gs:rgba(150,80,170,.22);
    --focus:#6a4cff;
    --display:'Fraunces', Georgia, 'Times New Roman', serif;
    --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a0f2e; --ink:#f7ebff; --berry:#e0477f;
      --b1:rgba(214,58,127,.42); --b2:rgba(124,92,255,.42); --b3:rgba(45,190,160,.28); --b4:rgba(255,180,90,.2);
      --g1:rgba(255,255,255,.17); --g2:rgba(255,255,255,.05); --gb:rgba(255,255,255,.24); --gh:rgba(255,255,255,.38); --gs:rgba(0,0,0,.42);
      --focus:#b9a6ff;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.6;-webkit-font-smoothing:antialiased}
  section{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.25rem;text-align:center}
  h1,h2{font-family:var(--display);font-weight:600;line-height:1.1;margin:0 0 .75rem;text-wrap:balance}
  h1{font-size:clamp(2.3rem,9vw,4.2rem)}
  h2{font-size:clamp(1.7rem,6vw,2.6rem)}
  p{margin:.25rem 0;max-width:34rem}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .hidden{display:none !important}
  .small{font-size:.9rem;opacity:.75}

  /* ---------- Fondo ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg i{position:absolute;width:80vmax;height:80vmax;border-radius:50%}
  .bg i:nth-child(1){left:-30vmax;top:-30vmax;background:radial-gradient(circle,var(--b1),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
  .bg i:nth-child(2){right:-35vmax;top:-10vmax;background:radial-gradient(circle,var(--b2),transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
  .bg i:nth-child(3){left:-25vmax;bottom:-40vmax;background:radial-gradient(circle,var(--b3),transparent 62%);animation:drift2 29s ease-in-out infinite alternate-reverse}
  .bg i:nth-child(4){right:-30vmax;bottom:-35vmax;background:radial-gradient(circle,var(--b4),transparent 62%);animation:drift1 35s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-12vmax,8vmax,0) scale(1.15)}}

  /* ---------- Cristal líquido ---------- */
  .glass{position:relative;isolation:isolate;
    background:linear-gradient(145deg,var(--g1),var(--g2));
    border:1px solid var(--gb);
    -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
    box-shadow:inset 0 1px 0 var(--gh),inset 0 -1px 0 rgba(255,255,255,.14),0 14px 34px var(--gs)}
  .glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
    background:radial-gradient(150px circle at var(--mx,28%) var(--my,0%),rgba(255,255,255,.6),transparent 70%);opacity:.75}
  .pill{border-radius:999px;padding:.45rem 1.15rem}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass{background:var(--g1)}
  }

  /* ---------- Botones ---------- */
  .actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1.1rem}
  .btn{position:relative;overflow:hidden;isolation:isolate;margin-top:1.1rem;color:#fff;font-weight:700;letter-spacing:.01em;
    border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:.85rem 1.7rem;
    background:linear-gradient(180deg,#e8508a,#c22d70);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 14px rgba(120,10,60,.28),0 10px 24px rgba(194,45,112,.38);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
  .actions .btn{margin-top:0}
  .btn::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s}
  .btn:hover{transform:translateY(-2px)}
  .btn:hover::after{transform:translateX(130%)}
  .btn:active{transform:scale(.94)}
  .btn.ghost{color:var(--ink);
    background:linear-gradient(145deg,var(--g1),var(--g2));
    -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
    box-shadow:inset 0 1px 0 var(--gh),0 8px 20px var(--gs);border-color:var(--gb)}
  #finish{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}

  /* ---------- Título con letras que entran ---------- */
  .w{display:inline-block;white-space:nowrap}
  .ch{display:inline-block;animation:chIn .85s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 40ms + 150ms)}
  @keyframes chIn{from{opacity:0;transform:translateY(.6em) scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}

  /* ---------- Pastel ---------- */
  #cake-wrap{position:relative;width:min(310px,74vw);margin:.75rem auto 0;animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  #cake{width:100%;height:auto;display:block;cursor:pointer;overflow:visible;filter:drop-shadow(0 16px 22px rgba(150,60,140,.22))}
  .tw{position:absolute;line-height:1;pointer-events:none;animation:twinkle 3s ease-in-out infinite}
  .tw:nth-of-type(1){left:2%;top:14%;font-size:18px;color:var(--butter)}
  .tw:nth-of-type(2){right:0;top:8%;font-size:24px;color:var(--lav);animation-delay:.9s}
  .tw:nth-of-type(3){right:4%;top:52%;font-size:14px;color:var(--rose);animation-delay:1.7s}
  .tw:nth-of-type(4){left:0;top:58%;font-size:20px;color:var(--mint);animation-delay:2.3s}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
  .fs{--s:1;transform:scale(var(--s));transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.34,1.3,.5,1)}
  .fs.h{transform-origin:center}
  
  /* Llama externa: baile orgánico en reposo */
  .flame{
    transform-box:fill-box;
    transform-origin:50% 100%;
    filter:drop-shadow(0 0 7px rgba(255,160,20,0.85)) drop-shadow(0 -3px 10px rgba(255,70,0,0.5));
    animation:flameDance .26s infinite alternate ease-in-out;
  }
  /* Núcleo interno incandescente */
  .flame-core{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:coreDance .26s infinite alternate ease-in-out;
    pointer-events:none;
  }
  .fs:nth-child(1) .flame{animation-duration:.25s;animation-delay:0s}
  .fs:nth-child(2) .flame{animation-duration:.31s;animation-delay:.08s}
  .fs:nth-child(3) .flame{animation-duration:.28s;animation-delay:.16s}
  .fs:nth-child(1) .flame-core{animation-duration:.25s}
  .fs:nth-child(2) .flame-core{animation-duration:.31s;animation-delay:.08s}
  .fs:nth-child(3) .flame-core{animation-duration:.28s;animation-delay:.16s}

  @keyframes flameDance{
    0%{transform:scale(1,1) rotate(-3deg) skewX(-2deg)}
    35%{transform:scale(.95,1.06) rotate(2deg) skewX(2deg)}
    70%{transform:scale(1.04,.96) rotate(-1deg) skewX(-3deg)}
    100%{transform:scale(.92,1.08) rotate(3deg) skewX(2deg)}
  }
  @keyframes coreDance{
    0%{transform:scale(1,1) rotate(-2deg);opacity:.95}
    50%{transform:scale(.93,1.06) rotate(1deg);opacity:1}
    100%{transform:scale(1.03,.94) rotate(2deg);opacity:.85}
  }

  .halo{transform-box:fill-box;transform-origin:center;animation:haloPulse 1.6s ease-in-out infinite alternate;transition:transform .2s,opacity .2s}
  @keyframes haloPulse{
    from{transform:scale(.9);opacity:.65}
    to{transform:scale(1.1);opacity:1}
  }

  /* Fuego agitado al soplar: estiramiento diagonal, turbulencia caótica y flickering de alta frecuencia */
  #cake.blowing .flame, #cake.winded .flame{
    animation:fireBlown .11s infinite alternate cubic-bezier(.3,.8,.4,1) !important;
    filter:drop-shadow(0 0 12px rgba(255,90,0,0.95)) drop-shadow(4px -3px 14px rgba(255,30,0,0.7));
  }
  #cake.blowing .flame-core, #cake.winded .flame-core{
    animation:coreBlown .11s infinite alternate cubic-bezier(.3,.8,.4,1) !important;
  }
  #cake.blowing .halo, #cake.winded .halo{
    animation:haloBlown .12s infinite alternate ease-in-out !important;
  }
  #cake.blowing .fs:nth-child(2) .flame, #cake.winded .fs:nth-child(2) .flame{animation-delay:-.04s !important}
  #cake.blowing .fs:nth-child(3) .flame, #cake.winded .fs:nth-child(3) .flame{animation-delay:-.07s !important}

  @keyframes fireBlown{
    0%{
      transform:rotate(calc(var(--blow-angle, 32deg) - 6deg)) skewX(22deg) scale(1.18, 0.52);
      opacity:.95;
    }
    28%{
      transform:rotate(calc(var(--blow-angle, 32deg) + 14deg)) skewX(38deg) scale(1.38, 0.40);
      opacity:.78;
    }
    60%{
      transform:rotate(calc(var(--blow-angle, 32deg) - 3deg)) skewX(18deg) scale(1.08, 0.62);
      opacity:.92;
    }
    82%{
      transform:rotate(calc(var(--blow-angle, 32deg) + 18deg)) skewX(42deg) scale(1.46, 0.35);
      opacity:.72;
    }
    100%{
      transform:rotate(calc(var(--blow-angle, 32deg) + 5deg)) skewX(26deg) scale(1.22, 0.48);
      opacity:.98;
    }
  }

  @keyframes coreBlown{
    0%{transform:rotate(calc(var(--blow-angle, 32deg) - 4deg)) skewX(18deg) scale(1.12, 0.48);opacity:.9}
    50%{transform:rotate(calc(var(--blow-angle, 32deg) + 12deg)) skewX(32deg) scale(1.28, 0.32);opacity:.45}
    100%{transform:rotate(calc(var(--blow-angle, 32deg) + 2deg)) skewX(22deg) scale(1.06, 0.42);opacity:.85}
  }

  @keyframes haloBlown{
    0%{transform:translate(10px, 4px) scale(.65);opacity:.4}
    50%{transform:translate(18px, 7px) scale(.35);opacity:.18}
    100%{transform:translate(13px, 5px) scale(.5);opacity:.35}
  }

  /* Sobresalto de extinción momentánea al primer soplido fuerte */
  .flame.gasp{
    animation:gaspFlutter .45s ease-out forwards !important;
  }
  @keyframes gaspFlutter{
    0%{transform:rotate(38deg) skewX(32deg) scale(1.3, 0.38);opacity:.9}
    30%{transform:rotate(46deg) skewX(44deg) scale(0.4, 0.18);opacity:.25}
    65%{transform:rotate(28deg) skewX(22deg) scale(0.85, 0.65);opacity:.75}
    100%{transform:rotate(32deg) skewX(26deg) scale(1.15, 0.52);opacity:.92}
  }

  .flame.out,.flame-core.out,.halo.out{animation:none !important;opacity:0 !important;transform:scale(.2) !important;transition:opacity .35s,transform .35s}
  .puff{fill:rgba(140,110,170,.4);opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 1.8s ease-out both}
  @keyframes puff{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    20%{opacity:.7}
    100%{opacity:0;transform:translate(6px,-46px) scale(2.4)}
  }
  /* Partículas de chispa de fuego que vuelan con el soplido */
  .fire-spark{
    position:fixed;
    pointer-events:none;
    z-index:23;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px #ffbe0b, 0 0 12px #fb5607, 0 0 2px #fff;
    animation:sparkFly .55s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes sparkFly{
    0%{opacity:1;transform:translate3d(0,0,0) scale(1.3)}
    45%{opacity:.95}
    100%{opacity:0;transform:translate3d(var(--sx),var(--sy),0) scale(.2)}
  }
  .wish-burst{position:fixed;z-index:25;pointer-events:none;font-size:24px;line-height:1;animation:wishRise 2.2s cubic-bezier(.22,1,.36,1) forwards;filter:drop-shadow(0 4px 10px rgba(255,209,102,.7))}
  @keyframes wishRise{
    0%{opacity:1;transform:translate3d(0,0,0) scale(.3) rotate(0deg)}
    50%{opacity:1;transform:translate3d(var(--tx),var(--ty),0) scale(1.4) rotate(var(--tr))}
    100%{opacity:0;transform:translate3d(var(--tx),calc(var(--ty) - 90px),0) scale(.8) rotate(calc(var(--tr) * 2))}
  }
  .glow-flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,225,140,.5),rgba(255,143,184,.2),transparent 75%);z-index:8;pointer-events:none;opacity:0;transition:opacity .4s ease-out}
  .glow-flash.on{opacity:1;transition:opacity .2s ease-in}

  /* Ráfaga de viento visual sobre el pastel */
  .wind-gust{position:absolute;left:-20%;top:18%;width:140%;height:65px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.75),transparent);filter:blur(8px);border-radius:50%;opacity:0;z-index:5}
  .wind-gust.active{animation:gustSweep 0.65s cubic-bezier(.2,.8,.4,1) forwards}
  @keyframes gustSweep{
    0%{opacity:0;transform:translateX(-100px) scaleY(0.7) skewX(-25deg)}
    35%{opacity:0.9}
    100%{opacity:0;transform:translateX(110px) scaleY(1.3) skewX(-35deg)}
  }

  /* Chispitas que vuelan con el aire */
  .ember{position:fixed;pointer-events:none;z-index:22;width:6px;height:6px;border-radius:50%;background:#ffd166;box-shadow:0 0 10px #ff6fa5, 0 0 4px #fff;animation:emberFly 0.75s ease-out forwards}
  @keyframes emberFly{
    0%{opacity:1;transform:translate3d(0,0,0) scale(1)}
    100%{opacity:0;transform:translate3d(var(--ex),var(--ey),0) scale(0.2)}
  }

  /* Medidor en tiempo real de soplido */
  .blow-meter{width:min(240px,70vw);height:10px;margin:0.85rem auto 0;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.5);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,0.12);display:none}
  .blow-meter.on{display:block;animation:pop .4s ease-out both}
  .blow-meter-bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--rose),var(--butter));transition:width 0.06s linear;box-shadow:0 0 10px rgba(255,111,165,0.8)}
  #hint{margin-top:1rem;font-weight:700}
  #hint:empty{display:none}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:9}
  .sparkle{position:fixed;z-index:20;pointer-events:none;font-size:15px;line-height:1}

  /* ---------- Carta ---------- */
  .polaroid{position:relative;z-index:2;background:#fff;padding:.6rem .6rem 1.8rem;border-radius:6px;
    box-shadow:0 14px 30px rgba(150,60,140,.28);transform:rotate(-2.5deg);width:min(240px,66vw);margin:.5rem 0 1.4rem}
  .polaroid::before{content:"";position:absolute;left:50%;top:-12px;width:74px;height:24px;transform:translateX(-50%) rotate(3deg);
    background:rgba(255,209,102,.72);border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
  .polaroid img{width:100%;display:block;border-radius:3px}
  .envelope{position:relative;width:min(300px,80vw);height:190px;padding:0;margin:.5rem 0 1rem;
    border:1px solid rgba(255,255,255,.8);border-radius:22px;
    background:linear-gradient(155deg,rgba(255,255,255,.78),rgba(255,160,200,.55));
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -14px 24px rgba(214,58,127,.16),0 16px 34px rgba(214,58,127,.26)}
  .envelope::before{content:"";position:absolute;inset:0;border-radius:22px;
    background:linear-gradient(to top right,transparent 49%,rgba(194,45,112,.2) 50%,transparent 52%) left/50% 100% no-repeat,
               linear-gradient(to top left,transparent 49%,rgba(194,45,112,.2) 50%,transparent 52%) right/50% 100% no-repeat}
  .flap{position:absolute;top:0;left:0;width:100%;height:60%;border-radius:22px 22px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,140,190,.8));
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
  .envelope.open .flap{transform:rotateX(180deg);opacity:0;transition:transform .7s cubic-bezier(.3,1.2,.5,1),opacity .35s .3s}
  .envelope:not(.open){animation:wiggle 2.6s ease-in-out infinite}
  .envelope::after{content:"";position:absolute;inset:0;border-radius:22px;border:3px solid var(--rose);opacity:0;pointer-events:none;animation:wave 2.6s ease-out infinite}
  .envelope.open::after{display:none}
  .envelope.open{opacity:.35;transition:opacity .6s .3s}
  .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2;width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;color:#fff;font-size:1.1rem;
    background:radial-gradient(circle at 35% 30%,#ff8fb8,#c22d70);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px rgba(194,45,112,.4)}
  .envelope.open .seal{display:none}
  @keyframes wiggle{
    0%,58%,100%{transform:rotate(0)}
    62%{transform:rotate(-4deg) scale(1.03)}
    68%{transform:rotate(4deg) scale(1.03)}
    74%{transform:rotate(-3deg)}
    80%{transform:rotate(2deg)}
    86%{transform:rotate(-1deg)}
  }
  @keyframes wave{
    0%,60%{transform:scale(1);opacity:0}
    62%{opacity:.85}
    100%{transform:scale(1.4);opacity:0}
  }
  #letter{max-width:34rem;text-align:left;border-radius:28px;padding:1.6rem 1.5rem;
    font-family:var(--display);font-weight:400;font-size:1.15rem;line-height:1.75;white-space:pre-wrap;
    animation:letterRise .8s cubic-bezier(.2,1.2,.3,1) both}
  #letter.typing::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:text-bottom;background:var(--berry);animation:blink 1s steps(2) infinite}
  @keyframes letterRise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Tarjetas ---------- */
  .dots{display:inline-flex;gap:6px;margin-right:.6rem;vertical-align:middle}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(194,45,112,.2);box-shadow:inset 0 0 0 1px rgba(194,45,112,.25);transition:transform .45s cubic-bezier(.34,1.8,.64,1),background .3s}
  .dot.on{background:var(--rose);transform:scale(1.25);box-shadow:0 0 10px rgba(255,111,165,.7)}
  #progress-wrap{font-weight:600;font-size:.95rem;margin-top:.25rem;white-space:nowrap}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;width:min(720px,100%);margin-top:1.4rem}
  .card{position:relative;background:none;border:0;padding:0;height:176px;color:var(--ink)}
  .card::after{content:"";position:absolute;inset:0;border-radius:26px;border:3px solid var(--rose);opacity:0;pointer-events:none}
  .card:not(.seen){animation:cwiggle 5.4s ease-in-out infinite;animation-delay:var(--d,0s)}
  .card:not(.seen)::after{animation:cwave 5.4s ease-out infinite;animation-delay:var(--d,0s)}
  @keyframes cwiggle{
    0%,16%,100%{transform:rotate(0)}
    2%{transform:rotate(-5deg) scale(1.04)}
    5%{transform:rotate(5deg) scale(1.04)}
    8%{transform:rotate(-3deg)}
    11%{transform:rotate(2deg)}
    14%{transform:rotate(-1deg)}
  }
  @keyframes cwave{
    0%{transform:scale(1);opacity:0}
    1%{opacity:.85}
    14%{transform:scale(1.25);opacity:0}
    100%{transform:scale(1.25);opacity:0}
  }
  .card .in{display:block;position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.34,1.3,.5,1);transform-style:preserve-3d;transform:perspective(800px) rotateY(0deg)}
  .card[aria-pressed="true"] .in{transform:perspective(800px) rotateY(180deg)}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:1rem;
    border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--gh),inset 0 -10px 18px rgba(255,255,255,.12),0 14px 30px var(--gs)}
  .front{--tint:#ffc2da;background:linear-gradient(150deg,rgba(255,255,255,.8),var(--tint) 75%)}
  .card:nth-child(4n+2) .front{--tint:#d6cbff}
  .card:nth-child(4n+3) .front{--tint:#b5efdc}
  .card:nth-child(4n+4) .front{--tint:#ffe6a3}
  .front::before{content:"";position:absolute;left:8px;right:8px;top:7px;height:40%;border-radius:20px 20px 44px 44px;
    background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
  .hicon{width:46px;height:46px;fill:var(--berry);filter:drop-shadow(0 4px 8px rgba(194,45,112,.3))}
  .back{transform:rotateY(180deg);background:linear-gradient(150deg,var(--g1),var(--g2));font-family:var(--display);font-size:1.02rem;line-height:1.45}

  /* ---------- Final ---------- */
  #s-end{overflow:hidden}
  .orb{position:relative;width:min(250px,62vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
  .orb .heart{width:52%;fill:var(--berry);filter:drop-shadow(0 8px 14px rgba(194,45,112,.4));animation:beat 1.3s ease-in-out .8s infinite}
  .orbit{position:absolute;inset:-16px;animation:spin 14s linear infinite;pointer-events:none}
  .orbit i{position:absolute;font-style:normal;font-size:18px;line-height:1;color:var(--butter)}
  .orbit i:nth-child(1){left:50%;top:0;transform:translateX(-50%)}
  .orbit i:nth-child(2){right:8%;bottom:14%;color:var(--lav)}
  .orbit i:nth-child(3){left:8%;bottom:14%;color:var(--mint)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #final-text{font-size:clamp(2.2rem,9vw,4.4rem);margin:1.6rem 0 .5rem;animation:rise .9s ease-out 1s both}
  #final-from{font-family:var(--display);font-style:italic;font-size:1.3rem;animation:rise .9s ease-out 1.4s both}
  #replay{animation:rise .9s ease-out 1.9s both}
  .floaty{position:absolute;bottom:-2rem;opacity:0;pointer-events:none;animation:floatUp 6s linear forwards}
  @keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.12)}36%{transform:scale(1)}54%{transform:scale(1.08)}72%{transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.75}100%{transform:translateY(-105svh) rotate(20deg);opacity:0}}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .bg i,#cake-wrap,.tw,.ch,.halo,.puff{animation:none}
    .envelope:not(.open),.envelope::after{animation:none}
    .card:not(.seen),.card:not(.seen)::after{animation:none}
    .card .in,.flap{transition:none}
    #letter,#finish,.orb,.orb .heart,.orbit,#final-text,#final-from,#replay,.music-btn.playing{animation:none}
  }
  .music-btn{position:fixed;top:1rem;right:1rem;z-index:30;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gb);background:linear-gradient(145deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 1px 0 var(--gh),0 8px 20px var(--gs);cursor:pointer;font-size:1.2rem;transition:transform .3s,box-shadow .3s}
  .music-btn:hover{transform:scale(1.08)}
  .music-btn.playing{animation:spinMusic 8s linear infinite}
  @keyframes spinMusic{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>

<script>
/* ============ EDITA SOLO ESTA PARTE ============ */
const CONFIG = {
  nombre: "Mi Reina 👑",
  de: "Tu esposo",
  carta:
`Feliz cumpleaños, Mi Reina 👑

Hoy celebro tu vida, tu sonrisa y la inmensa dicha de compartir cada día contigo. Gracias por ser mi compañera, mi apoyo incondicional y el corazón de nuestro hogar.

Deseo que en tu día y siempre, la vida te regale tanta felicidad, amor y bendiciones como las que tú me das a diario.

Con todo mi amor,
Tu esposo`,
  razones: [
    "Tus besos, que me reinician la vida y me llenan de paz.",
    "Tus caricias, que me calman el alma y me hacen sentir en casa.",
    "Tu sonrisa y la ternura con la que siempre cuidas de nosotros.",
    "Tu fortaleza, tu nobleza y todo lo bonito que construimos día con día."
  ],
  final: "La amo mucho ❤️, Mi Vida, Feliz cumpleaños 🎂"
};
/* ================================================ */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PALETTE = ['#ff6fa5','#ffd166','#7fdcc0','#b9a6ff','#ffffff'];
const HEART = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';

document.title = `Feliz cumpleaños, ${CONFIG.nombre}`;
$('final-text').textContent = CONFIG.final;
$('final-from').textContent = '— ' + CONFIG.de;

/* ---- Música de fondo (Alejandro Sanz o piano suave) ---- */
const bgm = $('bgm');
const musicBtn = $('music-toggle');
let userInteractedMusic = false, synthPlaying = false, synthCtx = null, synthInterval = null;

function startPianoFallback(){
  if (synthPlaying) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    synthCtx = new AudioCtx();
    if (synthCtx.state === 'suspended') synthCtx.resume();
    synthPlaying = true;
    musicBtn.classList.add('playing');
    musicBtn.textContent = '🎵';

    // Acordes suaves románticos
    const chords = [
      [261.63, 329.63, 392.00, 523.25], // C
      [220.00, 261.63, 329.63, 440.00], // Am
      [174.61, 220.00, 261.63, 349.23], // F
      [196.00, 246.94, 293.66, 392.00]  // G
    ];
    let step = 0;
    function playChord(){
      if (!synthPlaying || !synthCtx) return;
      const now = synthCtx.currentTime;
      const chord = chords[step % chords.length];
      chord.forEach((freq, idx) => {
        const osc = synthCtx.createOscillator();
        const gain = synthCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.001, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.07, now + idx * 0.12 + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 2.4);
        osc.connect(gain);
        gain.connect(synthCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 2.5);
      });
      step++;
    }
    playChord();
    synthInterval = setInterval(playChord, 2800);
  } catch(e){}
}

function stopPianoFallback(){
  synthPlaying = false;
  if (synthInterval){ clearInterval(synthInterval); synthInterval = null; }
  if (synthCtx){ synthCtx.close(); synthCtx = null; }
}

function startMusic(){
  if (userInteractedMusic) return;
  if (!bgm) return;
  const playPromise = bgm.play();
  if (playPromise !== undefined){
    playPromise.then(() => {
      userInteractedMusic = true;
      if (musicBtn){
        musicBtn.classList.add('playing');
        musicBtn.textContent = '🎵';
      }
      removeAutoListeners();
    }).catch(() => {
      // Bloqueado temporalmente por política del navegador; el listener al primer toque lo iniciará
    });
  }
}

if (bgm){
  bgm.onerror = () => {
    if (!userInteractedMusic) startPianoFallback();
  };
}

const tryAutoPlay = () => {
  if (!userInteractedMusic) startMusic();
};

const autoEvents = ['click', 'touchstart', 'touchend', 'pointerdown', 'scroll'];
function addAutoListeners(){
  autoEvents.forEach(evt => window.addEventListener(evt, tryAutoPlay, { passive: true, capture: true }));
}
function removeAutoListeners(){
  autoEvents.forEach(evt => window.removeEventListener(evt, tryAutoPlay, { capture: true }));
}

// Intentar reproducción instantánea
startMusic();
addAutoListeners();
document.addEventListener('DOMContentLoaded', startMusic);
window.addEventListener('load', startMusic);

if (musicBtn){
  musicBtn.onclick = (e) => {
    e.stopPropagation();
    userInteractedMusic = true;
    if (bgm && !bgm.paused){
      bgm.pause();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '🔇';
    } else if (synthPlaying){
      stopPianoFallback();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '🔇';
    } else {
      if (bgm){
        bgm.play().then(() => {
          musicBtn.classList.add('playing');
          musicBtn.textContent = '🎵';
        }).catch(() => {
          startPianoFallback();
        });
      } else {
        startPianoFallback();
      }
    }
  };
}

/* ---- Título: las letras entran una a una ---- */
function splitTitle(el, text){
  el.textContent = ''; el.setAttribute('aria-label', text);
  let i = 0; const words = text.split(' ');
  words.forEach((word, wi) => {
    const w = document.createElement('span'); w.className = 'w'; w.setAttribute('aria-hidden', 'true');
    for (const ch of word){
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; s.style.setProperty('--i', i++);
      w.appendChild(s);
    }
    el.appendChild(w);
    if (wi < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
}
splitTitle($('title'), `Feliz cumpleaños, ${CONFIG.nombre}`);

/* ---- Microinteracciones: destellos al tocar y brillo que sigue al dedo ---- */
function sparkles(x, y, n = 7){
  if (reduce) return;
  for (let i = 0; i < n; i++){
    const s = document.createElement('span');
    s.className = 'sparkle'; s.textContent = '✦';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.color = PALETTE[i % 4];
    document.body.appendChild(s);
    if (!s.animate){ s.remove(); continue; }
    const a = (i / n) * 6.283 + Math.random()*.6, d = 28 + Math.random()*32;
    s.animate([
      {transform: 'translate(-50%,-50%) scale(.2)', opacity: 1},
      {transform: `translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(1) rotate(90deg)`, opacity: 0}
    ], {duration: 650, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'forwards'}).onfinish = () => s.remove();
  }
}
document.addEventListener('click', e => {
  const t = e.target.closest('.btn, .card, .envelope, #cake'); if (!t) return;
  let x = e.clientX, y = e.clientY;
  if (!x && !y){ const r = t.getBoundingClientRect(); x = r.left + r.width/2; y = r.top + r.height/2; }
  sparkles(x, y);
});
document.addEventListener('pointermove', e => {
  const g = e.target.closest ? e.target.closest('.glass') : null; if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  g.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* ---- Confeti (Escalado HiDPI) ---- */
const cv = $('confetti'), cx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let parts = [];
function sizeCanvas(){
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
function confetti(){
  if (reduce) return;
  for (let i = 0; i < 160; i++){
    parts.push({x: innerWidth/2, y: innerHeight*0.45, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4,
      s: 5+Math.random()*6, r: Math.random()*6, vr:(Math.random()-.5)*.4, c: PALETTE[i%PALETTE.length], life: 0});
  }
  if (parts.length === 160) loop();
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 240);
  for (const p of parts){
    p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); cx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else cx.clearRect(0,0,innerWidth,innerHeight);
}

/* ---- Velitas: dos soplidos o toques ---- */
let out = false, blows = 0, cooling = false;
const lights = () => document.querySelectorAll('#cake .halo, #cake .flame, #cake .flame-core');

const isWebView = /FBAN|FBAV|Instagram|WhatsApp|Line|Messenger/i.test(navigator.userAgent);
if (isWebView){
  const mn = $('mic-note');
  if (mn) mn.textContent = '💡 Si abres esto desde WhatsApp, toca el pastel directamente para apagar las velitas.';
}

function playWishSound(){
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    // Campanitas mágicas ascendentes: Do6, Mi6, Sol6, Si6, Do7, Mi7
    const notes = [1046.50, 1318.51, 1567.98, 1975.53, 2093.00, 2637.02];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
      gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.08 + 1.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.08);
      osc.stop(ctx.currentTime + i * 0.08 + 1.3);
    });
  } catch(e){}
}

function triggerWindGust(){
  const gust = $('wind-gust');
  if (gust){
    gust.classList.remove('active');
    void gust.offsetWidth;
    gust.classList.add('active');
  }
  const cake = $('cake');
  if (!cake) return;
  const rect = cake.getBoundingClientRect();
  for (let i = 0; i < 6; i++){
    const ember = document.createElement('span');
    ember.className = 'ember';
    ember.style.left = (rect.left + rect.width * (0.35 + Math.random() * 0.3)) + 'px';
    ember.style.top = (rect.top + rect.height * (0.24 + Math.random() * 0.08)) + 'px';
    ember.style.setProperty('--ex', (40 + Math.random() * 80) + 'px');
    ember.style.setProperty('--ey', (-30 - Math.random() * 45) + 'px');
    document.body.appendChild(ember);
    setTimeout(() => ember.remove(), 750);
  }
}

function launchWishSparks(){
  const cake = $('cake');
  const rect = cake.getBoundingClientRect();
  const sparks = ['✨', '✦', '⭐', '💫', '💖'];
  const candleXs = [0.35, 0.50, 0.65]; // mechas sobre el ancho del pastel
  
  candleXs.forEach((cxRatio, ci) => {
    const originX = rect.left + rect.width * cxRatio;
    const originY = rect.top + rect.height * 0.28;
    for (let i = 0; i < 6; i++){
      const s = document.createElement('span');
      s.className = 'wish-burst';
      s.textContent = sparks[(ci + i) % sparks.length];
      s.style.left = originX + 'px';
      s.style.top = originY + 'px';
      const angle = (Math.random() - 0.5) * 1.5 - Math.PI / 2; // abanico ascendente
      const dist = 90 + Math.random() * 120;
      s.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      s.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      s.style.setProperty('--tr', ((Math.random() - 0.5) * 60) + 'deg');
      s.style.animationDelay = (ci * 70 + i * 50) + 'ms';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 2500);
    }
  });
}

function spawnFireSparks(candleIdx, count = 2){
  const cake = $('cake');
  if (!cake) return;
  const rect = cake.getBoundingClientRect();
  const xs = [0.35, 0.50, 0.65];
  const originX = rect.left + rect.width * (xs[candleIdx] ?? 0.5);
  const originY = rect.top + rect.height * 0.26;
  for (let i = 0; i < count; i++){
    const sp = document.createElement('span');
    sp.className = 'fire-spark';
    sp.style.left = (originX + (Math.random() - 0.5) * 10) + 'px';
    sp.style.top = (originY + (Math.random() - 0.5) * 6) + 'px';
    sp.style.setProperty('--sx', (30 + Math.random() * 65) + 'px');
    sp.style.setProperty('--sy', (-18 - Math.random() * 36) + 'px');
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 560);
  }
}

function blow(){
  if (out || cooling) return;
  blows++;
  if (navigator.vibrate) navigator.vibrate([40, 30, 40]);
  triggerWindGust();

  // Chispitas volando de las velas
  [0, 1, 2].forEach(ci => spawnFireSparks(ci, 3));

  if (blows >= 2){ blowOut(); return; }

  // Primer soplido: fuego sacudido violentamente, una vela casi se ahoga
  const cake = $('cake');
  cake.classList.add('winded');
  cake.style.setProperty('--blow-angle', '38deg');

  const flames = document.querySelectorAll('#cake .flame');
  if (flames[1]){
    flames[1].classList.add('gasp');
    setTimeout(() => flames[1]?.classList.remove('gasp'), 460);
  }

  document.querySelectorAll('#cake .fs').forEach(f => f.style.setProperty('--s', '.58'));
  cake.setAttribute('aria-label','Pastel con tres velitas agitadas luchando contra el viento');
  $('hint').textContent = '¡Casi! Las llamas luchan contra el aire… ¡Sopla una vez más!';
  cooling = true; setTimeout(() => { cooling = false; }, 850);
}

function blowOut(){
  if (out) return; out = true;
  const cake = $('cake');
  cake.classList.remove('winded', 'blowing');
  cake.style.removeProperty('--blow-angle');
  $('blow-meter')?.classList.remove('on');
  if (navigator.vibrate) navigator.vibrate([60, 80, 140]);
  playWishSound();

  lights().forEach((f, i) => setTimeout(() => f.classList.add('out'), (i % 3) * 160));

  // Destello cálido en pantalla móvil
  const flash = $('glow-flash');
  if (flash){
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 500);
  }
  launchWishSparks();

  if (!reduce){
    const g = $('smoke');
    [105, 150, 195].forEach((cxp, i) => {
      for (let k = 0; k < 2; k++){
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', cxp); c.setAttribute('cy', 76); c.setAttribute('r', 4 + k*2);
        c.setAttribute('class', 'puff'); c.style.animationDelay = (i*180 + k*250 + 150) + 'ms';
        g.appendChild(c);
      }
    });
  }
  cake.setAttribute('aria-label','Pastel con las velitas apagadas');
  $('hint').textContent = '✨ ¡Deseo pedido con el corazón! ✨';
  $('mic').classList.add('hidden'); $('tap').classList.add('hidden');
  setTimeout(() => { confetti(); reveal('s-letter'); }, 1400);
}
$('tap').onclick = blow;
$('cake').onclick = blow;

let listening = false;
async function startMic(){
  if (listening || out) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('hint').textContent = 'Toca el pastel directamente para apagar las velitas.';
    return;
  }
  $('hint').textContent = 'Acepta el permiso del micrófono cuando aparezca…';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {echoCancellation:false, noiseSuppression:false, autoGainControl:false}
    });
    listening = true;
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    const an = ac.createAnalyser(); an.fftSize = 512;
    ac.createMediaStreamSource(stream).connect(an);
    const data = new Uint8Array(an.fftSize);
    let loud = 0, quiet = 0, armed = true;
    const cake = $('cake');
    $('mic').classList.add('hidden');
    $('blow-meter')?.classList.add('on');
    $('hint').textContent = 'Te escucho… ¡sopla hacia el micrófono!';
    (function tick(){
      if (out){
        stream.getTracks().forEach(t => t.stop());
        ac.close();
        cake.classList.remove('blowing', 'winded');
        $('blow-meter')?.classList.remove('on');
        return;
      }
      an.getByteTimeDomainData(data);
      let sum = 0; for (const v of data){ const d = (v-128)/128; sum += d*d; }
      const rms = Math.sqrt(sum/data.length);

      // Barra visual de intensidad
      const pct = Math.min(100, Math.round((rms / 0.16) * 100));
      const bar = $('blow-bar');
      if (bar) bar.style.width = pct + '%';

      // Dinámica reactiva de fuego vivo al detectar flujo de aire
      if (rms > 0.04 && !out){
        cake.classList.add('blowing');
        const bend = Math.min(50, Math.round(22 + rms * 155));
        cake.style.setProperty('--blow-angle', bend + 'deg');
        if (rms > 0.08 && Math.random() < 0.42){
          spawnFireSparks(Math.floor(Math.random() * 3), 1);
        }
      } else if (!out){
        cake.classList.remove('blowing');
      }

      if (!armed){
        quiet = rms < 0.09 ? quiet+1 : 0;
        if (quiet > 14){ armed = true; loud = 0; }
      } else {
        loud = rms > 0.15 ? loud+1 : Math.max(0, loud-1);
        if (loud > 5){ blow(); loud = 0; quiet = 0; armed = false; }
      }
      requestAnimationFrame(tick);
    })();
  }catch(e){
    listening = false;
    $('blow-meter')?.classList.remove('on');
    $('hint').textContent = 'Toca el pastel directamente para apagar las velitas.';
    $('tap').style.transform = 'scale(1.05)';
    $('mic').textContent = 'Reintentar micrófono';
  }
}

$('mic').onclick = startMic;

/* ---- Revelar secciones ---- */
function reveal(id){
  const el = $(id); el.classList.remove('hidden');
  el.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
}

/* ---- Carta con máquina de escribir ---- */
$('envelope').onclick = function(){
  if (this.classList.contains('open')) return;
  this.classList.add('open'); this.disabled = true;
  const box = $('letter'); box.classList.remove('hidden');
  const text = CONFIG.carta; let i = 0;
  const done = () => { box.classList.remove('typing'); $('next').classList.remove('hidden'); };
  if (reduce){ box.textContent = text; done(); return; }
  box.classList.add('typing');
  (function type(){
    box.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(type, 38); else done();
  })();
};
$('next').onclick = () => reveal('s-reasons');

/* ---- Final: fuegos artificiales HiDPI + corazones ---- */
const fx = $('fx'), fc = fx.getContext('2d');
function sizeFx(){
  fx.width = innerWidth * dpr;
  fx.height = innerHeight * dpr;
  fx.style.width = innerWidth + 'px';
  fx.style.height = innerHeight + 'px';
  fc.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeFx(); addEventListener('resize', sizeFx);
let sparks = [], fxRunning = false, pending = 0;
function burst(x, y){
  const base = PALETTE[Math.floor(Math.random()*4)];
  for (let i = 0; i < 80; i++){
    const a = Math.random()*Math.PI*2, v = 1.5 + Math.random()*4.5;
    sparks.push({x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life: 0, max: 60 + Math.random()*40,
                 c: Math.random() < .7 ? base : '#ffd166'});
  }
  if (!fxRunning){ fxRunning = true; fxLoop(); }
}
function fxLoop(){
  fc.globalCompositeOperation = 'destination-out';
  fc.fillStyle = 'rgba(0,0,0,.18)'; fc.fillRect(0, 0, innerWidth, innerHeight);   // deja estela
  fc.globalCompositeOperation = 'source-over';
  sparks = sparks.filter(p => p.life < p.max);
  for (const p of sparks){
    p.vy += .05; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.life++;
    fc.globalAlpha = 1 - p.life/p.max; fc.fillStyle = p.c;
    fc.beginPath(); fc.arc(p.x, p.y, 2, 0, 6.283); fc.fill();
  }
  fc.globalAlpha = 1;
  if (sparks.length || pending > 0) requestAnimationFrame(fxLoop);
  else { fc.clearRect(0, 0, innerWidth, innerHeight); fxRunning = false; }
}
function fireworks(n){
  if (reduce) return;
  pending = n; let i = 0;
  const t = setInterval(() => {
    burst(innerWidth*(.15 + Math.random()*.7), innerHeight*(.12 + Math.random()*.35));
    pending--; if (++i >= n) clearInterval(t);
  }, 420);
}
let heartsTimer = null;
function startHearts(){
  if (reduce || heartsTimer) return;
  heartsTimer = setInterval(() => {
    if (document.hidden) return;
    const s = $('s-end'); if (s.classList.contains('hidden')) return;
    const h = document.createElement('span'); h.className = 'floaty'; h.textContent = '♥';
    h.style.left = Math.random()*100 + '%';
    h.style.fontSize = (14 + Math.random()*22) + 'px';
    h.style.color = PALETTE[Math.floor(Math.random()*4)];
    h.style.animationDuration = (5 + Math.random()*4) + 's';
    h.addEventListener('animationend', () => h.remove());
    s.appendChild(h);
  }, 450);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && heartsTimer){
    clearInterval(heartsTimer); heartsTimer = null;
  } else if (!document.hidden){
    const s = $('s-end');
    if (s && !s.classList.contains('hidden')) startHearts();
  }
});
$('finish').onclick = () => {
  reveal('s-end');
  setTimeout(() => { confetti(); fireworks(10); startHearts(); }, 700);
};
$('replay').onclick = () => { confetti(); fireworks(8); };

/* ---- Progreso de tarjetas ---- */
const total = CONFIG.razones.length;
for (let i = 0; i < total; i++){ const d = document.createElement('span'); d.className = 'dot'; $('dots').appendChild(d); }
function updateProgress(){
  const n = document.querySelectorAll('.card.seen').length;
  document.querySelectorAll('#dots .dot').forEach((d, i) => d.classList.toggle('on', i < n));
  $('progress').textContent = n < total ? `${n} de ${total} volteadas` : `¡Las ${total}!`;
  if (n === total) $('finish').classList.remove('hidden');
}
$('progress').textContent = `Voltea las ${total} tarjetas.`;

/* ---- Tarjetas ---- */
CONFIG.razones.forEach((txt, i) => {
  const b = document.createElement('button');
  b.className = 'card'; b.setAttribute('aria-pressed','false'); b.style.setProperty('--d', (i*0.9)+'s');
  b.innerHTML = '<span class="in"><span class="face front" aria-hidden="true"><svg class="hicon" viewBox="0 0 24 24"><path d="' + HEART + '"/></svg></span><span class="face back"></span></span>';
  b.querySelector('.back').textContent = txt;
  b.onclick = () => { b.classList.add('seen'); updateProgress(); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); };
  $('cards').appendChild(b);
});
